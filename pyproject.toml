[project]
name = "komoot-mcp-server"
version = "0.1.0"
description = "MCP server for Komoot — browse tours, download GPX, plan routes with AI assistance"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    # Pinned <0.1.0 because we rely on kompy Tour._create_* internals
    # (see client.py docstring) which may change without notice.
    "kompy>=0.0.12,<0.1.0",
    "openrouteservice>=2.3.0",
    "gpxpy>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest-asyncio>=0.23",
    "pytest>=8.0",
    "ruff>=0.6",
    "vcrpy>=6.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["build", "dist"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "UP",
  "B",
  "C4",
  "PIE",
  "SIM",
  "RET",
  "FURB",
  "ISC",
  "RUF",
  "N",
  "A",
  "DTZ",
  "T20",
  "PERF",
  "RSE",
  "PGH",
  "G",
  "LOG",
  "YTT",
  "EXE",
  "INT",
  "TID",
]

ignore = [
  "ISC001", # conflicts with the formatter
  "RUF002", # flags em-dashes, which are deliberate throughout the docstrings
  "RUF013", # implicit Optional. Correct and wanted, but spelling out `| None` on
]
